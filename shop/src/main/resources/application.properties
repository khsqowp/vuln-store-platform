spring.application.name=shop
server.port=${SERVER_PORT:8100}
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vulshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:}
app.jwt.secret=${JWT_SECRET:local-vulnerable-jwt-secret}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:2592000}
