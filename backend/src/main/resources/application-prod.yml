spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/vulshop?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

file:
  upload-dir: /app/uploads

logging:
  level:
    com.vulshop: INFO
    root: WARN
