spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER,USERS;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: VulShop2024!ThisIsASecretKeyForTestingPurposeOnly!
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  issuer: vulshop.com

file:
  upload-dir: build/test-uploads
