services:

  # ── Web tier: Nginx + React static ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "${WEB_PORT:-10080}:80"
    depends_on:
      - app
    networks:
      - public-net
    restart: unless-stopped

  # ── App tier: Spring Boot ────────────────────────────────────────────────────
  app:
    build:
      context: ./shop
    ports:
      - "${BACKEND_PORT:-18100}:${SERVER_PORT:-8100}"
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8100}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vulshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-2592000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public-net
      - private-net
    restart: unless-stopped

  # ── DB tier: MySQL ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - private-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  public-net:
  private-net:

volumes:
  mysql-data:
